<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Employee List</title>

    <style>
        form {
            margin-bottom: 20px;
        }

        form input[type="search"],
        form button {
            padding: 4px;
        }

        table {
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid black;
            padding: 4px;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            border: 1px solid black;
            padding: 4px 12px;
        }
    </style>
</head>

<body>
    <h2>Employee List</h2>

    <form th:action="@{/employees/list}" method="get">
        <input type="search" name="search" placeholder="Enter name to search" th:value="${param.search}">
        <button type="submit">Search</button>
    </form>

    <table>
        <tr>
            <th>ID</th>
            <th>Code</th>
            <th>Name</th>
            <th>Email</th>
            <th>Department</th>
        </tr>
        <tr th:each="emp : ${employees}">
            <td th:text="${emp.id}"></td>
            <td th:text="${emp.code}"></td>
            <td th:text="${emp.name}"></td>
            <td th:text="${emp.email}"></td>
            <td th:text="${emp.department.getName()}"></td>
        </tr>
    </table>

    <a th:href="@{/employees/add}">Add New Employee</a>
</body>

</html>
